name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  WRANGLER: wrangler@4.151.2
  PLAYWRIGHT: playwright@1.63.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V2 domain reducer tests
        run: node --test test/v2-domain.test.mjs
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Install Playwright, Chromium and Firefox for the browser tests
        run: |
          npm install --no-save --no-audit --no-fund "$PLAYWRIGHT"
          npx playwright install --with-deps chromium firefox
      - name: V2 IndexedDB persistence tests (real browsers)
        run: |
          node --test test/v2-storage.test.mjs
          BROWSER=firefox node --test test/v2-storage.test.mjs
      - name: Start the Go server
        run: |
          go build -o panier .
          echo "GO_SETUP=$(./panier -data "$RUNNER_TEMP/data" -setup-code)" >> "$GITHUB_ENV"
          ./panier -data "$RUNNER_TEMP/data" > "$RUNNER_TEMP/go.log" 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
      - name: Start the Cloudflare Worker locally
        run: |
          npx --yes "$WRANGLER" dev --ip 127.0.0.1 --port 8787 --persist-to "$RUNNER_TEMP/worker" \
            --var SETUP_CODE:TEST-CODE-1234 --var MAX_LOG_BYTES:1048576 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 120); do curl -sf -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
      - name: API tests, both servers
        run: |
          BASE=http://127.0.0.1:8080 SETUP="$GO_SETUP" node --test test/api.test.mjs
          BASE=http://127.0.0.1:8787 SETUP=TEST-CODE-1234 FULL=1 node --test test/api.test.mjs
      - name: Browser tests, both servers
        run: |
          BASE=http://127.0.0.1:8080 SETUP="$GO_SETUP" STORE="$RUNNER_TEMP/data" node --test test/browser.test.mjs
          BASE=http://127.0.0.1:8787 SETUP=TEST-CODE-1234 STORE="$RUNNER_TEMP/worker" node --test test/browser.test.mjs
      - name: Browser tests in Firefox
        run: BROWSER=firefox BASE=http://127.0.0.1:8080 SETUP="$GO_SETUP" STORE="$RUNNER_TEMP/data" node --test test/browser.test.mjs
      - name: Update test, with two builds of the Go server
        run: |
          cp web/sw.js "$RUNNER_TEMP/sw.js"
          for v in old new; do
            sed -i "s/^const VERSION = \".*\";/const VERSION = \"$v\";/" web/sw.js
            go build -o "$RUNNER_TEMP/panier-$v" .
          done
          cp "$RUNNER_TEMP/sw.js" web/sw.js
          PANIER_OLD="$RUNNER_TEMP/panier-old" PANIER_NEW="$RUNNER_TEMP/panier-new" node --test test/update.test.mjs
      - name: Server logs
        if: failure()
        run: cat "$RUNNER_TEMP/go.log" "$RUNNER_TEMP/wrangler.log"

  # Deploys to Cloudflare after the tests pass, once the repository's secrets are set
  # (see docs/cloudflare.md). Without them, this job does nothing.
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SETUP_CODE: ${{ secrets.PANIER_SETUP_CODE }}
      DOMAIN: ${{ secrets.PANIER_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -o pipefail
          if [ ${#SETUP_CODE} -lt 12 ]; then
            echo "Set the PANIER_SETUP_CODE secret to a code of at least 12 characters (see docs/cloudflare.md)."
            exit 1
          fi
          # Phones notice a new release by the version in the service worker.
          sed -i "s/^const VERSION = \"dev\";/const VERSION = \"${GITHUB_SHA::7}\";/" web/sw.js
          grep -q "^const VERSION = \"${GITHUB_SHA::7}\";" web/sw.js
          jq -n --arg c "$SETUP_CODE" '{SETUP_CODE: $c}' > "$RUNNER_TEMP/secrets.json"
          trap 'rm -f "$RUNNER_TEMP/secrets.json"' EXIT
          # The logs of a public repository are public: hide the workers.dev address and any email.
          npx --yes "$WRANGLER" deploy --secrets-file "$RUNNER_TEMP/secrets.json" ${DOMAIN:+--domains "$DOMAIN"} 2>&1 \
            | sed -E -e 's#[A-Za-z0-9.-]+\.workers\.dev#<your address>.workers.dev#g' -e 's#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+#<email>#g'

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build for the Raspberry Pi and PCs
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sed -i "s/^const VERSION = \"dev\";/const VERSION = \"$TAG\";/" web/sw.js
          grep -q "^const VERSION = \"$TAG\";" web/sw.js
          mkdir dist
          build() { CGO_ENABLED=0 GOOS=linux GOARCH=$1 GOARM=$2 go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/panier-linux-$3" .; }
          build arm64 "" arm64   # Raspberry Pi 3, 4, 5 with a 64-bit system
          build arm 7 armv7      # Raspberry Pi 2, 3, 4 with a 32-bit system
          build arm 6 armv6      # Raspberry Pi Zero and 1
          build amd64 "" amd64
          cd dist && sha256sum panier-* > SHA256SUMS
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
