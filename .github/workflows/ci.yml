name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  WRANGLER: wrangler@4.151.2
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: API tests against the Go server
        run: |
          go build -o panier .
          code=$(./panier -data "$RUNNER_TEMP/data" -setup-code)
          ./panier -data "$RUNNER_TEMP/data" &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          BASE=http://127.0.0.1:8080 SETUP="$code" node --test test/api.test.mjs
      - name: API tests against the Cloudflare Worker
        run: |
          npx --yes "$WRANGLER" dev --ip 127.0.0.1 --port 8787 --persist-to "$RUNNER_TEMP/worker" \
            --var SETUP_CODE:TEST-CODE-1234 --var MAX_LOG_BYTES:1048576 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 120); do curl -sf -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
          BASE=http://127.0.0.1:8787 SETUP=TEST-CODE-1234 FULL=1 node --test test/api.test.mjs \
            || { cat "$RUNNER_TEMP/wrangler.log"; exit 1; }

  # Deploys to Cloudflare after the tests pass, once the repository's secrets are set
  # (see docs/cloudflare.md). Without them, this job does nothing.
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SETUP_CODE: ${{ secrets.PANIER_SETUP_CODE }}
      DOMAIN: ${{ secrets.PANIER_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -o pipefail
          if [ ${#SETUP_CODE} -lt 12 ]; then
            echo "Set the PANIER_SETUP_CODE secret to a code of at least 12 characters (see docs/cloudflare.md)."
            exit 1
          fi
          jq -n --arg c "$SETUP_CODE" '{SETUP_CODE: $c}' > "$RUNNER_TEMP/secrets.json"
          trap 'rm -f "$RUNNER_TEMP/secrets.json"' EXIT
          # The logs of a public repository are public: hide the workers.dev address and any email.
          npx --yes "$WRANGLER" deploy --secrets-file "$RUNNER_TEMP/secrets.json" ${DOMAIN:+--domains "$DOMAIN"} 2>&1 \
            | sed -E -e 's#[A-Za-z0-9.-]+\.workers\.dev#<your address>.workers.dev#g' -e 's#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+#<email>#g'

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build for the Raspberry Pi and PCs
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist
          build() { CGO_ENABLED=0 GOOS=linux GOARCH=$1 GOARM=$2 go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/panier-linux-$3" .; }
          build arm64 "" arm64   # Raspberry Pi 3, 4, 5 with a 64-bit system
          build arm 7 armv7      # Raspberry Pi 2, 3, 4 with a 32-bit system
          build arm 6 armv6      # Raspberry Pi Zero and 1
          build amd64 "" amd64
          cd dist && sha256sum panier-* > SHA256SUMS
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
